# Nacos dataId: gateway-service.yml   group: DEFAULT_GROUP
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: supplier-service
          uri: lb://supplier-service
          predicates:
            - Path=/api/v1/suppliers/**
        - id: purchase-service
          uri: lb://purchase-service
          predicates:
            - Path=/api/v1/orders/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

jwt:
  secret: change-me-to-a-long-random-string-at-least-256-bits
