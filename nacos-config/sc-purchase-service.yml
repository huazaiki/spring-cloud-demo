# Nacos dataId: sc-purchase-service.yml   group: DEFAULT_GROUP
spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration/purchase-service
  datasource:
    url: jdbc:mysql://localhost:3306/purchase_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: purchase-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# Resilience4j 熔断：按 Feign 客户端名（sc-inventory-service / sc-supplier-service）独立熔断
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      sc-inventory-service:
        base-config: default
      sc-supplier-service:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      sc-inventory-service:
        base-config: default
      sc-supplier-service:
        base-config: default

# Seata 分布式事务（AT 模式，TM：创建/审批采购订单）
seata:
  enabled: true
  application-id: sc-purchase-service
  tx-service-group: sc_tx_group
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: localhost:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default
      username: ""
      password: ""
  config:
    type: file
  service:
    vgroup-mapping:
      sc_tx_group: default