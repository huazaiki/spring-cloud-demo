# Nacos dataId: sc-gateway-service.yml   group: DEFAULT_GROUP
spring:
  cloud:
    gateway:
      routes:
        - id: sc-auth-service
          uri: lb://sc-auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: sc-auth-admin
          uri: lb://sc-auth-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/depts/**,/api/v1/roles/**,/api/v1/permissions/**
        - id: sc-supplier-service
          uri: lb://sc-supplier-service
          predicates:
            - Path=/api/v1/suppliers/**
        - id: sc-purchase-service
          uri: lb://sc-purchase-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/requisitions/**,/api/v1/approval-tasks/**
        - id: sc-inventory-service
          uri: lb://sc-inventory-service
          predicates:
            - Path=/api/v1/inventory/**,/api/v1/receives/**,/api/v1/quality-inspections/**
        - id: sc-payment-service
          uri: lb://sc-payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/invoices/**,/api/v1/payment-vouchers/**
        - id: sc-purchase-reports
          uri: lb://sc-purchase-service
          predicates:
            - Path=/api/v1/reports/procurement-dashboard
        - id: sc-payment-reports
          uri: lb://sc-payment-service
          predicates:
            - Path=/api/v1/reports/payable-aging
        - id: sc-inventory-reports
          uri: lb://sc-inventory-service
          predicates:
            - Path=/api/v1/reports/inventory-summary

jwt:
  secret: change-me-to-a-long-random-string-at-least-256-bits