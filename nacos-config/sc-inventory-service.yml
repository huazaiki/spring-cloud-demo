# Nacos dataId: sc-inventory-service.yml   group: DEFAULT_GROUP
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Seata 分布式事务（AT 模式，RM：库存预留/入库作为全局事务分支）
seata:
  enabled: true
  application-id: sc-inventory-service
  tx-service-group: sc_tx_group
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: localhost:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default
      username: ""
      password: ""
  config:
    type: file
  service:
    vgroup-mapping:
      sc_tx_group: default